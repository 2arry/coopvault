[project]
name = "coopvault"
authors = [
    { name = "Larry Adah", email = "larryadah@gmail.com"}
]
description = "Cooperative savings, contributions and member loans management"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
    "requests",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
